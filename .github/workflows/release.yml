name: Release APK

# vX.Y 태그가 push 되면 서명된 release APK 를 빌드해 GitHub Release 로 발행한다.
# 앱의 "업그레이드" 버튼이 이 릴리스를 읽는다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_B64      : base64 -i android/fss-release.jks   결과 한 줄
#   KEYSTORE_PASSWORD : keystore.properties 의 storePassword
#   KEY_ALIAS         : fss
#   KEY_PASSWORD      : keystore.properties 의 keyPassword

# 기본은 로컬에서 `./release.sh <ver>` (gh 로그인 시 맥에서 빌드+발행).
# 이 워크플로는 맥이 없을 때를 위한 예비 — Actions 탭에서 tag 를 지정해 수동 실행한다.
# (KEYSTORE_B64 등 시크릿 4개가 올바로 등록돼 있어야 함)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스할 태그 (예: v2.9). 먼저 push 돼 있어야 함"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore signing key
        run: |
          printf '%s' "${{ secrets.KEYSTORE_B64 }}" | tr -d ' \n\r\t' | base64 -d > android/fss-release.jks
          printf 'storeFile=fss-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
            > android/keystore.properties
          echo "keystore bytes: $(wc -c < android/fss-release.jks)"
          keytool -list -keystore android/fss-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null \
            && echo "✅ keystore OK" \
            || { echo "❌ KEYSTORE_B64 시크릿이 손상됨 — 값을 다시 등록하세요 (아래 안내)"; exit 1; }

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Dump error on failure
        if: failure()
        run: |
          {
            echo '## Gradle build failed — last 200 lines'
            echo '```'
            tail -n 200 /tmp/build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=================== BUILD LOG TAIL ==================="
          tail -n 200 /tmp/build.log 2>/dev/null || true
          # 오류 요지를 annotation 으로 (API 로 읽기 위함)
          grep -nE "FAILURE:|What went wrong|Caused by:|> Task .* FAILED|error:|Execution failed|Could not|Unable to|A problem occurred" /tmp/build.log \
            | tail -n 25 | while IFS= read -r l; do echo "::error::${l}"; done || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
