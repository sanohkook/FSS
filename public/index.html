<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>예약현황</title>
  <meta name="description" content="인천 앞바다 배낚시 물때·조류·선박 예약 현황을 한 판에서" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="head-inner">
      <div class="brand">
        <h1><span class="tick" aria-hidden="true">◧</span>예약현황</h1>
        <p>인천 앞바다 배낚시 · 물때·조류 <a href="https://www.khoa.go.kr/" target="_blank" rel="noopener">국립해양조사원</a> 조석예보</p>
      </div>
      <span class="label" id="mLabel"></span>
      <div class="actions">
        <button class="icon-btn" id="themeBtn" aria-label="테마 전환">◐</button>
        <button id="planBtn" class="badge">나의 예약 <span class="n" id="planCount">0</span></button>
        <button id="settingsBtn">사이트 추가</button>
        <span class="upd" id="updAge" title="예약 현황 마지막 갱신"></span>
        <button class="btn-primary" id="refreshBtn">Refresh</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="boatbar" id="boatbar" aria-label="배 표시/숨김"></div>
    <div class="mulbar" id="flowbar" aria-label="조류 세기 필터"></div>
    <div class="legend">
      <span class="grp"><span class="mul t-sari" style="padding:1px 6px">7·8물</span> 큰 물(사리)</span>
      <span class="grp"><span class="mul t-mid" style="padding:1px 6px">5·6·9·10물</span> 중간</span>
      <span class="grp"><span class="chip s-open">여유</span><span class="chip s-few">잔여 임박</span><span class="chip s-full">마감</span><span class="chip s-unknown">예약 확인</span></span>
    </div>

    <div class="hscroll" id="hscroll" hidden>
      <span class="hint" id="hscrollHint"></span>
      <button id="hLeft" aria-label="왼쪽으로">‹ 이전 배</button>
      <button id="hRight" aria-label="오른쪽으로">다음 배 ›</button>
    </div>
    <div class="tablecard">
      <div class="scroller">
        <table id="grid">
          <colgroup id="gridCols"></colgroup>
          <thead id="gridHead"></thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </div>
    <p class="foot-note" id="footNote"></p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
