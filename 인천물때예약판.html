<title>인천 물때 예약판</title>
<meta name="description" content="인천 앞바다 배낚시 물때와 선박 예약 현황을 한 판에서 보는 도구" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --ground: #eef2f3;
    --surface: #ffffff;
    --surface-2: #f5f8f9;
    --panel: #ffffff;
    --ink: #16272e;
    --ink-2: #56707a;
    --ink-3: #86a0a8;
    --line: #d3dee1;
    --line-2: #e3eaec;
    --accent: #0b7a94;
    --accent-deep: #084a5b;
    --accent-soft: #e0eef1;
    --sari: #b4531f;
    --open: #2e7d5b;
    --few: #b3730c;
    --full: #c0392f;
    --open-bg: #e6f2ec;
    --few-bg: #f6ecda;
    --full-bg: #f6e5e3;
    --sat: #2657a6;
    --sun: #b23b3b;
    --shadow: 0 1px 2px rgba(16,39,46,.06), 0 8px 24px rgba(16,39,46,.08);
    --flow-lo: #a9c2c8;
    --flow-hi: #0b7a94;
    --on-accent: #ffffff;
    --on-accent-deep: #ffffff;
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0d181d;
      --surface: #14232a;
      --surface-2: #1a2c34;
      --panel: #17272f;
      --ink: #e0ebee;
      --ink-2: #90a8b1;
      --ink-3: #647d86;
      --line: #26404a;
      --line-2: #1f333b;
      --accent: #2bb6d4;
      --accent-deep: #7fd6e6;
      --accent-soft: #123840;
      --sari: #e08a5c;
      --open: #4fbe8b;
      --few: #e0a53c;
      --full: #e5766b;
      --open-bg: #14332a;
      --few-bg: #33291736;
      --full-bg: #351f1e;
      --sat: #7ba7e6;
      --sun: #e58b8b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
      --flow-lo: #3a5960;
      --flow-hi: #2bb6d4;
      --on-accent: #06222b;
      --on-accent-deep: #06222b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0d181d;
    --surface: #14232a;
    --surface-2: #1a2c34;
    --panel: #17272f;
    --ink: #e0ebee;
    --ink-2: #90a8b1;
    --ink-3: #647d86;
    --line: #26404a;
    --line-2: #1f333b;
    --accent: #2bb6d4;
    --accent-deep: #7fd6e6;
    --accent-soft: #123840;
    --sari: #e08a5c;
    --open: #4fbe8b;
    --few: #e0a53c;
    --full: #e5766b;
    --open-bg: #14332a;
    --few-bg: #322917;
    --full-bg: #351f1e;
    --sat: #7ba7e6;
    --sun: #e58b8b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
    --flow-lo: #3a5960;
    --flow-hi: #2bb6d4;
    --on-accent: #06222b;
    --on-accent-deep: #06222b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    font-weight: 400;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .head-inner {
    max-width: 1120px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 16px 20px; flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
  .brand h1 {
    margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .brand .tick { color: var(--accent); font-size: 15px; }
  .brand p { margin: 0; font-size: 11.5px; color: var(--ink-2); letter-spacing: 0.02em; }

  .monthnav { display: flex; align-items: center; gap: 4px; }
  .monthnav .label {
    min-width: 132px; text-align: center; font-weight: 500; font-size: 14.5px;
    letter-spacing: 0.01em;
  }
  .monthnav .label .yr { color: var(--ink-2); font-weight: 400; }

  button {
    font: inherit; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 12px;
    transition: background .12s, border-color .12s, transform .05s;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn { padding: 7px 9px; line-height: 1; display: inline-flex; }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    font-weight: 500;
  }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--on-accent-deep); }
  .actions { display: flex; gap: 8px; }

  /* ---- site bar ---- */
  .sitebar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 16px 2px 2px;
  }
  .sitebar .sb-label {
    font-size: 11.5px; color: var(--ink-2); letter-spacing: .03em;
    text-transform: uppercase; margin-right: 2px;
  }
  .sb-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  }
  .sb-chip .dot {
    width: 7px; height: 7px; border-radius: 999px; background: var(--ink-3);
  }
  .sb-chip[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent-soft); color: var(--ink);
  }
  .sb-chip[aria-pressed="true"] .dot { background: var(--accent); }
  .sb-chip.add { color: var(--ink-2); border-style: dashed; }

  /* ---- legend ---- */
  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
    padding: 12px 2px 14px; font-size: 11.5px; color: var(--ink-2);
  }
  .legend .grp { display: flex; align-items: center; gap: 7px; }
  .legend .sw { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 500;
    border: 1px solid transparent;
  }
  .chip.s-open { color: var(--open); background: var(--open-bg); border-color: color-mix(in srgb, var(--open) 30%, transparent); }
  .chip.s-few { color: var(--few); background: var(--few-bg); border-color: color-mix(in srgb, var(--few) 30%, transparent); }
  .chip.s-full { color: var(--full); background: var(--full-bg); border-color: color-mix(in srgb, var(--full) 30%, transparent); }
  .chip.s-unknown { color: var(--ink-3); background: transparent; border-color: var(--line); }

  /* ---- table ---- */
  .tablecard {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  .scroller { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  /* 날짜·물때·물흐름은 내용에 딱 맞는 최소 폭 고정, 나머지는 사이트 열이 차지 */
  col.c-w-date { width: 1%; }
  col.c-w-mul { width: 1%; }
  col.c-w-flow { width: 1%; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--surface-2);
    font-weight: 500; font-size: 11.5px; letter-spacing: 0.03em;
    color: var(--ink-2); text-transform: uppercase;
    padding: 9px 8px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  thead th.fix { width: 1%; }
  thead th.site-h {
    text-transform: none; letter-spacing: 0; font-size: 12.5px;
    color: var(--ink); font-weight: 600; text-align: center;
    border-left: 1px solid var(--line-2);
  }
  thead th.site-h .h-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  thead th.site-h .mini {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 6px; padding: 3px 6px; font-size: 11px; line-height: 1;
  }
  tbody td {
    padding: 7px 10px; border-bottom: 1px solid var(--line-2);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.wknd-sat { background: color-mix(in srgb, var(--sat) 5%, transparent); }
  tbody tr.wknd-sun { background: color-mix(in srgb, var(--sun) 5%, transparent); }
  tbody tr.today { box-shadow: inset 3px 0 0 var(--accent); }
  tbody tr.today td:first-child { font-weight: 600; }
  tbody tr.sari td.c-mul { }

  tbody td { padding-left: 8px; padding-right: 8px; }
  td.c-date, td.c-mul, td.c-flow { white-space: nowrap; }
  td.c-date .d { font-weight: 600; font-size: 14px; }
  td.c-date .wd { font-size: 11.5px; color: var(--ink-2); margin-left: 3px; }
  td.c-date.sat .wd { color: var(--sat); }
  td.c-date.sun .wd { color: var(--sun); }
  td.c-date .lun { display: block; font-size: 10.5px; color: var(--ink-3); letter-spacing: .02em; }

  .mul {
    display: inline-flex; align-items: baseline; gap: 2px;
    padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 12.5px;
    white-space: nowrap;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line-2);
  }
  .mul.t-sari { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .mul.t-mid { background: var(--accent-soft); color: var(--accent-deep); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }

  .flow { display: flex; align-items: center; gap: 7px; width: 96px; }
  .flow .bar {
    flex: 1; height: 6px; border-radius: 999px; overflow: hidden;
    background: color-mix(in srgb, var(--ink-3) 22%, transparent);
  }
  .flow .bar > span { display: block; height: 100%; border-radius: 999px; }
  .flow .val { font-size: 11.5px; color: var(--ink-2); width: 34px; text-align: right; }
  .flow.est .val { color: var(--ink-3); }
  .flow.est .bar > span { opacity: .55; background-image: repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,255,255,.4) 3px 5px); }

  td.c-site { padding: 5px 8px; border-left: 1px solid var(--line-2); text-align: center; }
  .cell {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 6px; padding: 5px 7px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface);
    text-align: left;
  }
  .cell:hover { border-color: var(--accent); background: var(--accent-soft); }
  .cell .go { font-size: 11px; color: var(--ink-3); }
  .cell:hover .go { color: var(--accent); }
  .stat {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap; cursor: pointer;
    flex-shrink: 0;
  }
  .stat.s-open { color: var(--open); background: var(--open-bg); border-color: color-mix(in srgb,var(--open) 30%, transparent); }
  .stat.s-few { color: var(--few); background: var(--few-bg); border-color: color-mix(in srgb,var(--few) 30%, transparent); }
  .stat.s-full { color: var(--full); background: var(--full-bg); border-color: color-mix(in srgb,var(--full) 30%, transparent); }
  .stat.s-unknown { color: var(--ink-3); background: transparent; border-color: var(--line); }
  .stat.is-auto { border-width: 2px; padding: 1px 6px; }
  .stat .n { font-weight: 400; opacity: .85; }

  .empty { padding: 40px 16px; text-align: center; color: var(--ink-2); }

  /* ---- overlay + panels ---- */
  .scrim {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(10,22,27,.44); backdrop-filter: blur(2px);
    display: flex;
  }
  .scrim.center { align-items: center; justify-content: center; padding: 20px; }
  .scrim.right { justify-content: flex-end; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    max-height: 100%;
  }
  .panel.modal { border-radius: 14px; width: min(680px, 100%); max-height: min(86vh, 760px); }
  .panel.sheet { width: min(420px, 100%); height: 100%; border-radius: 0; border-right: none; border-top: none; border-bottom: none; }
  .panel-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--line);
  }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; margin-right: auto; }
  .panel-body { padding: 16px 18px; overflow-y: auto; }
  .panel-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

  label.fld { display: block; margin-bottom: 12px; }
  label.fld .lbl { display: block; font-size: 11.5px; color: var(--ink-2); letter-spacing: .02em; margin-bottom: 4px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px;
  }
  input[type=text].mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .site-edit { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
  .site-edit .top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .site-edit .top input { flex: 1; font-weight: 600; }
  .link-btn { background: none; border: none; padding: 4px 6px; color: var(--full); font-size: 12px; }
  .link-btn:hover { text-decoration: underline; border: none; }
  .hint { font-size: 11px; color: var(--ink-3); margin: 2px 0 0; }
  .hint code { background: var(--surface-2); padding: 0 4px; border-radius: 4px; font-size: 10.5px; }

  .parse-site { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .parse-site > summary {
    padding: 11px 13px; cursor: pointer; font-weight: 600; font-size: 13.5px;
    display: flex; align-items: center; gap: 8px; list-style: none;
    background: var(--surface-2);
  }
  .parse-site > summary::-webkit-details-marker { display: none; }
  .parse-site > summary .caret { color: var(--ink-3); transition: transform .15s; }
  .parse-site[open] > summary .caret { transform: rotate(90deg); }
  .parse-site .inner { padding: 13px; }
  .parse-site .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .status-msg { font-size: 12px; color: var(--ink-2); }
  .status-msg.err { color: var(--full); }
  .status-msg.ok { color: var(--open); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground); font-size: 12.5px;
    padding: 9px 16px; border-radius: 999px; z-index: 90; box-shadow: var(--shadow);
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .foot-note { font-size: 11px; color: var(--ink-3); margin-top: 14px; line-height: 1.6; }
  .foot-note b { color: var(--ink-2); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 560px) {
    .brand p { display: none; }
    .head-inner { gap: 10px; }
    .monthnav .label { min-width: 108px; font-size: 13px; }
  }
</style>

<header>
  <div class="head-inner">
    <div class="brand">
      <h1><span class="tick" aria-hidden="true">◧</span>인천 물때 예약판</h1>
      <p>인천 앞바다 배낚시 · 물때 · 선박 예약 현황</p>
    </div>
    <nav class="monthnav" aria-label="월 이동">
      <button class="icon-btn" id="prevM" aria-label="이전 달">‹</button>
      <span class="label" id="mLabel"></span>
      <button class="icon-btn" id="nextM" aria-label="다음 달">›</button>
    </nav>
    <div class="actions">
      <button class="btn-primary" id="openUpdate">업데이트</button>
      <button id="openSettings">설정</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="sitebar" id="sitebar" aria-label="표시할 예약 사이트"></div>
  <div class="legend" id="legend"></div>
  <div class="tablecard">
    <div class="scroller">
      <table id="grid">
        <colgroup id="gridCols"></colgroup>
        <thead id="gridHead"></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>
  </div>
  <p class="foot-note" id="footNote"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------- constants ----------
  var DATA_MIN = "2026-01", MAX_MONTH = "2027-12";
  var TODAY_ISO = (function () {
    var n = new Date();
    return n.getFullYear() + "-" + ("0" + (n.getMonth() + 1)).slice(-2) + "-" + ("0" + n.getDate()).slice(-2);
  })();
  var CUR_MONTH = TODAY_ISO.slice(0, 7);
  // 지난 달로는 이동 불가 — 오늘이 포함된 달이 시작점
  var MIN_MONTH = CUR_MONTH < DATA_MIN ? DATA_MIN : (CUR_MONTH > MAX_MONTH ? MAX_MONTH : CUR_MONTH);
  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  var SARI = { "7물": 1, "8물": 1 };            // 큰 물 (사리 전후)
  var MID = { "5물": 1, "6물": 1, "9물": 1, "10물": 1 };
  var STORE_KEY = "ijb.v1";
  var STATUS_CYCLE = ["unknown", "open", "few", "full"];
  var STATUS_LABEL = { unknown: "미확인", open: "여유", few: "여석", full: "마감" };

  var DEFAULT_SITES = [
    { id: "khan", name: "칸피싱", url: "https://khanfishing.com/index.php?mid=bk&year={y}&month={m}&day={d}&mode=list" },
    { id: "dy", name: "동양낚시", url: "https://dyfishing.sunsang24.com/ship/schedule_fleet/{y}{m}" },
    { id: "jeil", name: "제일낚시", url: "https://jnaksi.com/index.php?mid=bk&year={y}&month={m}&day={d}&mode=list" }
  ];

  // ---------- state ----------
  var state = load();

  function load() {
    var base = { sites: clone(DEFAULT_SITES), status: {}, hidden: {}, month: null };
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (Array.isArray(p.sites) && p.sites.length) {
          base.sites = p.sites.map(function (s) {
            if (s && s.url === "https://dyfishing.sunsang24.com/ship/schedule_fleet") {
              s.url = "https://dyfishing.sunsang24.com/ship/schedule_fleet/{y}{m}";
            }
            return s;
          });
        }
        if (p.status && typeof p.status === "object") base.status = p.status;
        if (p.hidden && typeof p.hidden === "object") base.hidden = p.hidden;
        if (p.month) base.month = p.month;
      }
    } catch (e) { /* start fresh */ }
    if (!base.month || base.month < MIN_MONTH || base.month > MAX_MONTH) {
      base.month = defaultMonth();
    }
    return base;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function visibleSites() {
    return state.sites.filter(function (s) { return !state.hidden[s.id]; });
  }

  function defaultMonth() { return MIN_MONTH; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // ---------- date helpers ----------
  function daysInMonth(month) {
    var y = +month.slice(0, 4), m = +month.slice(5, 7);
    return new Date(y, m, 0).getDate();
  }
  function shiftMonth(month, delta) {
    var y = +month.slice(0, 4), m = +month.slice(5, 7) - 1 + delta;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + "-" + pad(m + 1);
  }
  function buildUrl(tpl, iso) {
    var y = iso.slice(0, 4), m = iso.slice(5, 7), d = iso.slice(8, 10);
    if (/\{y|\{m|\{d/.test(tpl)) {
      return tpl.replace(/\{yyyy\}/g, y).replace(/\{y\}/g, y)
                .replace(/\{mm\}/g, m).replace(/\{m\}/g, m)
                .replace(/\{dd\}/g, d).replace(/\{d\}/g, d);
    }
    return tpl;
  }

  // ---------- status ----------
  // 수동 표시가 있으면 그것, 없으면 자동(AVAIL) 데이터
  function getStatus(siteId, iso) {
    var s = state.status[siteId];
    if (s && s[iso]) return s[iso];
    var a = window.AVAIL && window.AVAIL[siteId];
    if (a && a[iso]) { var v = a[iso]; return { s: v.s, n: v.n || "", auto: 1 }; }
    return null;
  }
  function manualStatus(siteId, iso) {
    var s = state.status[siteId];
    return (s && s[iso]) || null;
  }
  function setStatus(siteId, iso, obj) {
    if (!state.status[siteId]) state.status[siteId] = {};
    if (!obj || obj.s === "unknown") delete state.status[siteId][iso];
    else state.status[siteId][iso] = obj;
    save();
  }
  function cycleStatus(siteId, iso) {
    var cur = manualStatus(siteId, iso);
    var i = cur ? STATUS_CYCLE.indexOf(cur.s) : 0;
    var next = STATUS_CYCLE[(i + 1) % STATUS_CYCLE.length];
    setStatus(siteId, iso, next === "unknown" ? null : { s: next, n: cur && next === cur.s ? cur.n : "" });
  }

  // ---------- render ----------
  var el = {
    mLabel: document.getElementById("mLabel"),
    head: document.getElementById("gridHead"),
    body: document.getElementById("gridBody"),
    sitebar: document.getElementById("sitebar"),
    legend: document.getElementById("legend"),
    footNote: document.getElementById("footNote"),
    toast: document.getElementById("toast")
  };

  function render() {
    var month = state.month;
    el.mLabel.innerHTML = '<span class="yr">' + month.slice(0, 4) + '</span> &nbsp;' + (+month.slice(5, 7)) + '월';
    document.getElementById("prevM").disabled = month <= MIN_MONTH;
    document.getElementById("nextM").disabled = month >= MAX_MONTH;

    renderSiteBar();
    renderLegend();
    renderHead();
    renderBody(month);
    renderFootNote(month);
  }

  function renderSiteBar() {
    var h = '<span class="sb-label">예약 사이트</span>';
    state.sites.forEach(function (s) {
      var on = !state.hidden[s.id];
      h += '<button class="sb-chip" role="switch" aria-pressed="' + on + '" data-toggle="' + s.id + '">' +
        '<span class="dot" aria-hidden="true"></span>' + esc(s.name) + '</button>';
    });
    h += '<button class="sb-chip add" data-addsite>＋ 사이트 관리</button>';
    el.sitebar.innerHTML = h;
    el.sitebar.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-toggle");
        if (state.hidden[id]) delete state.hidden[id]; else state.hidden[id] = 1;
        save(); render();
      };
    });
    el.sitebar.querySelector("[data-addsite]").onclick = openSettings;
  }

  function renderLegend() {
    el.legend.innerHTML =
      '<span class="grp"><span class="mul t-sari" style="padding:1px 6px">7·8물</span> 큰 물(사리)</span>' +
      '<span class="grp"><span class="mul t-mid" style="padding:1px 6px">5·6·9·10물</span> 중간</span>' +
      '<span class="grp"><span class="sw" style="background:linear-gradient(90deg,var(--flow-lo),var(--flow-hi))"></span> 물흐름 세기</span>' +
      '<span class="grp"><span class="chip s-open">여유</span><span class="chip s-few">여석</span><span class="chip s-full">마감</span><span class="chip s-unknown">미확인</span> <span style="color:var(--ink-3)">(굵은 테두리=자동조회)</span></span>' +
      '<span class="grp" style="color:var(--ink-3)">칸 클릭 → 예약 페이지 · 상태칩 클릭 → 직접 수정</span>';
  }

  function renderHead() {
    var vs = visibleSites();
    var cg = '<col class="c-w-date"><col class="c-w-mul"><col class="c-w-flow">';
    for (var k = 0; k < vs.length; k++) cg += '<col>';
    document.getElementById("gridCols").innerHTML = cg;
    var h = '<tr>' +
      '<th class="fix">날짜</th>' +
      '<th class="fix">물때</th>' +
      '<th class="fix">물흐름</th>';
    vs.forEach(function (s) {
      h += '<th class="site-h" style="min-width:96px"><div class="h-row">' +
        esc(s.name) +
        '</div></th>';
    });
    h += '</tr>';
    el.head.innerHTML = h;
  }

  function renderBody(month) {
    var n = daysInMonth(month);
    var tISO = TODAY_ISO;
    var startDay = (month === CUR_MONTH) ? +tISO.slice(8, 10) : 1;
    var rows = "";
    for (var d = startDay; d <= n; d++) {
      var iso = month + "-" + pad(d);
      var rec = TIDE[iso];
      var jsDate = new Date(+month.slice(0, 4), +month.slice(5, 7) - 1, d);
      var wd = jsDate.getDay();
      var cls = [];
      if (wd === 6) cls.push("wknd-sat");
      if (wd === 0) cls.push("wknd-sun");
      if (iso === tISO) cls.push("today");
      var mul = rec ? rec.m : "";
      if (SARI[mul]) cls.push("sari");

      var dateCls = wd === 6 ? "sat" : wd === 0 ? "sun" : "";
      var row = '<tr class="' + cls.join(" ") + '">';
      row += '<td class="c-date ' + dateCls + '"><span class="d mono">' + d + '</span>' +
             '<span class="wd">' + WD[wd] + '</span>' +
             '<span class="lun">' + (rec ? "음 " + lunLabel(rec.l) : "") + '</span></td>';

      // 물때
      var mulCls = SARI[mul] ? "t-sari" : MID[mul] ? "t-mid" : "";
      row += '<td class="c-mul">' + (mul ? '<span class="mul ' + mulCls + '">' + esc(mul) + '</span>' : "&mdash;") + '</td>';

      // 물흐름
      if (rec) {
        var f = rec.f;
        var col = flowColor(f);
        var lab = rec.x ? rec.x : (rec.e ? "≈" + f + "%" : f + "%");
        row += '<td class="c-flow"><div class="flow' + (rec.e ? " est" : "") + '" ' +
               (rec.e ? 'title="2027년은 조석예보 기반 추정치"' : "") + '>' +
               '<span class="bar"><span style="width:' + f + '%;background:' + col + '"></span></span>' +
               '<span class="val mono">' + lab + '</span></div></td>';
      } else {
        row += '<td class="c-flow">&mdash;</td>';
      }

      // 사이트 칸
      visibleSites().forEach(function (s) {
        var st = getStatus(s.id, iso);
        var scode = st ? st.s : "unknown";
        var nlabel = st && st.n ? ' <span class="n">' + esc(st.n) + '</span>' : "";
        var autoCls = st && st.auto ? " is-auto" : "";
        row += '<td class="c-site">' +
          '<div class="cell" role="link" tabindex="0" data-open="' + s.id + '" data-iso="' + iso + '" ' +
          'title="' + esc(s.name) + ' 예약 페이지 열기 (' + iso + ')">' +
            '<button class="stat s-' + scode + autoCls + '" data-cycle="' + s.id + '" data-iso="' + iso + '" ' +
            'title="' + (st && st.auto ? "자동 조회 결과 · 클릭해 직접 수정" : "클릭해서 상태 표시") + '">' + STATUS_LABEL[scode] + nlabel + '</button>' +
            '<span class="go" aria-hidden="true">열기 ↗</span>' +
          '</div></td>';
      });

      row += '</tr>';
      rows += row;
    }
    el.body.innerHTML = rows || '<tr><td class="empty" colspan="' + (3 + visibleSites().length) + '">이 달 데이터가 없습니다.</td></tr>';
  }

  function renderFootNote(month) {
    var yr = month.slice(0, 4);
    var src = yr === "2027"
      ? '<b>물때</b>는 음력 기준 계산값(2026년 바다타임과 전 일자 일치 확인). <b>물흐름 %</b>는 국립해양조사원 인천 조석예보 조차를 바다타임 값에 맞춰 보정한 <b>추정치</b>(≈ 표시, 평균 오차 ±3.5%p).'
      : '<b>물때·물흐름</b>은 바다타임(badatime.com) 인천 자료. 물흐름은 그날 조차의 상대 세기(0~100%).';
    var auto = window.AVAIL_UPDATED
      ? '<b>예약 현황</b>은 하루 몇 차례 3개 사이트를 자동 조회해 채웁니다 (마지막 갱신 ' + esc(fmtWhen(window.AVAIL_UPDATED)) + '). 굵은 테두리 칩 = 자동. 칸을 누르면 해당 날짜 예약 페이지가 열리고, 칩을 누르면 직접 수정합니다.'
      : '<b>예약 현황</b>: 칸을 눌러 예약 페이지를 열어 확인하고, 상태칩을 눌러 직접 표시하거나 <b>업데이트</b>에서 붙여넣은 내용을 AI로 분석해 채우세요. (자동 조회 데이터 로딩 실패 또는 준비 중)';
    el.footNote.innerHTML = src + '<br>' + auto;
  }
  function fmtWhen(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var diff = (Date.now() - d) / 36e5;
    if (diff < 1) return Math.max(1, Math.round(diff * 60)) + "분 전";
    if (diff < 24) return Math.round(diff) + "시간 전";
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function lunLabel(day) { return day ? day : ""; }
  function flowColor(f) {
    // interpolate flow-lo -> flow-hi via css color-mix
    var t = Math.max(0, Math.min(100, f));
    return "color-mix(in srgb, var(--flow-hi) " + t + "%, var(--flow-lo))";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- interactions ----------
  document.getElementById("prevM").onclick = function () {
    if (state.month > MIN_MONTH) { state.month = shiftMonth(state.month, -1); save(); render(); }
  };
  document.getElementById("nextM").onclick = function () {
    if (state.month < MAX_MONTH) { state.month = shiftMonth(state.month, 1); save(); render(); }
  };

  el.body.addEventListener("click", function (e) {
    var cyc = e.target.closest("[data-cycle]");
    if (cyc) {
      e.stopPropagation();
      cycleStatus(cyc.getAttribute("data-cycle"), cyc.getAttribute("data-iso"));
      render();
      return;
    }
    var open = e.target.closest("[data-open]");
    if (open) openSite(open.getAttribute("data-open"), open.getAttribute("data-iso"));
  });
  el.body.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var open = e.target.closest("[data-open]");
    if (open) { e.preventDefault(); openSite(open.getAttribute("data-open"), open.getAttribute("data-iso")); }
  });

  function openSite(siteId, iso) {
    var site = state.sites.filter(function (s) { return s.id === siteId; })[0];
    if (!site || !site.url) { toast("URL이 설정되지 않았습니다 — 설정에서 추가하세요"); return; }
    window.open(buildUrl(site.url, iso), "_blank", "noopener");
  }

  // ---------- toast ----------
  var toastT;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.toast.classList.remove("show"); }, 2600);
  }

  // ---------- overlay plumbing ----------
  var scrim = null;
  function openOverlay(kind, node) {
    closeOverlay();
    scrim = document.createElement("div");
    scrim.className = "scrim " + kind;
    scrim.appendChild(node);
    scrim.addEventListener("mousedown", function (e) { if (e.target === scrim) closeOverlay(); });
    document.addEventListener("keydown", escClose);
    document.body.appendChild(scrim);
  }
  function closeOverlay() {
    if (scrim) { scrim.remove(); scrim = null; document.removeEventListener("keydown", escClose); }
  }
  function escClose(e) { if (e.key === "Escape") closeOverlay(); }

  // ---------- settings sheet ----------
  document.getElementById("openSettings").onclick = openSettings;

  function openSettings() {
    var p = document.createElement("div");
    p.className = "panel sheet";
    p.innerHTML =
      '<div class="panel-head"><h2>설정 — 예약 사이트</h2>' +
      '<button class="icon-btn" data-close aria-label="닫기">✕</button></div>' +
      '<div class="panel-body" id="setBody"></div>' +
      '<div class="panel-foot">' +
      '<button data-act="reset">기본값 복원</button>' +
      '<button data-act="clearstat">표시 전체 지우기</button>' +
      '<button class="btn-primary" data-close>완료</button></div>';
    openOverlay("right", p);
    p.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { closeOverlay(); render(); }; });
    p.querySelector('[data-act="reset"]').onclick = function () {
      if (confirm("사이트 목록을 기본값(칸피싱·동양낚시·제일낚시)으로 되돌릴까요?")) {
        state.sites = clone(DEFAULT_SITES); save(); drawSettings(p);
      }
    };
    p.querySelector('[data-act="clearstat"]').onclick = function () {
      if (confirm("직접 표시한 예약 상태를 모두 지울까요?")) { state.status = {}; save(); drawSettings(p); }
    };
    drawSettings(p);
  }

  function drawSettings(p) {
    var body = p.querySelector("#setBody");
    var html = "";
    state.sites.forEach(function (s, i) {
      html +=
        '<div class="site-edit" data-i="' + i + '">' +
          '<div class="top">' +
            '<input type="text" data-f="name" value="' + esc(s.name) + '" placeholder="사이트 이름" />' +
            '<button class="link-btn" data-del>삭제</button>' +
          '</div>' +
          '<input type="text" class="mono" data-f="url" value="' + esc(s.url) + '" placeholder="https://..." />' +
          '<p class="hint">날짜별로 열려면 <code>{y}</code> <code>{m}</code> <code>{d}</code> 를 넣으세요. 예: <code>?year={y}&month={m}&day={d}</code></p>' +
        '</div>';
    });
    html += '<button data-add style="width:100%;margin-top:4px">+ 사이트 추가</button>' +
      '<label class="fld" style="margin-top:20px"><span class="lbl">설정 백업 (JSON — 복사해 두면 다른 기기에서 붙여넣기 가능)</span>' +
      '<textarea id="backup" class="mono" style="min-height:90px" spellcheck="false"></textarea></label>' +
      '<div style="display:flex;gap:8px"><button data-copy>복사</button><button data-import>이 내용으로 불러오기</button></div>';
    body.innerHTML = html;

    body.querySelectorAll(".site-edit").forEach(function (card) {
      var i = +card.getAttribute("data-i");
      card.querySelectorAll("input").forEach(function (inp) {
        inp.oninput = function () {
          state.sites[i][inp.getAttribute("data-f")] = inp.value;
          if (inp.getAttribute("data-f") === "name" && !state.sites[i].id) state.sites[i].id = "s" + Date.now();
          save();
          fillBackup(body);
        };
      });
      card.querySelector("[data-del]").onclick = function () {
        state.sites.splice(i, 1); save(); drawSettings(p);
      };
    });
    body.querySelector("[data-add]").onclick = function () {
      state.sites.push({ id: "s" + Date.now(), name: "새 사이트", url: "https://" });
      save(); drawSettings(p);
    };
    body.querySelector("[data-copy]").onclick = function () {
      var t = body.querySelector("#backup");
      t.select();
      navigator.clipboard && navigator.clipboard.writeText(t.value).then(function () { toast("복사했습니다"); });
    };
    body.querySelector("[data-import]").onclick = function () {
      try {
        var p2 = JSON.parse(body.querySelector("#backup").value);
        if (Array.isArray(p2.sites)) state.sites = p2.sites;
        if (p2.status) state.status = p2.status;
        save(); drawSettings(p); render(); toast("불러왔습니다");
      } catch (e) { toast("JSON 형식이 아닙니다"); }
    };
    fillBackup(body);
  }
  function fillBackup(body) {
    var t = body.querySelector("#backup");
    if (t) t.value = JSON.stringify({ sites: state.sites, status: state.status }, null, 1);
  }

  // ---------- update modal (AI parse) ----------
  document.getElementById("openUpdate").onclick = openUpdate;

  var sampleNS; // cache
  function getSample() {
    if (sampleNS !== undefined) return Promise.resolve(sampleNS);
    if (!window.claude || !window.claude.use) { sampleNS = null; return Promise.resolve(null); }
    return window.claude.use("sample").then(function (s) { sampleNS = s || null; return sampleNS; },
      function () { sampleNS = null; return null; });
  }

  function openUpdate() {
    var month = state.month;
    var p = document.createElement("div");
    p.className = "panel modal";
    p.innerHTML =
      '<div class="panel-head"><h2>업데이트 &mdash; ' + month.slice(0, 4) + '년 ' + (+month.slice(5, 7)) + '월 예약 현황</h2>' +
      '<button class="icon-btn" data-close aria-label="닫기">✕</button></div>' +
      '<div class="panel-body" id="upBody"></div>' +
      '<div class="panel-foot">' +
      '<button data-act="refresh">달력만 새로고침</button>' +
      '<button class="btn-primary" data-close>닫기</button></div>';
    openOverlay("center", p);
    p.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { closeOverlay(); render(); }; });
    p.querySelector('[data-act="refresh"]').onclick = function () { render(); toast("달력을 새로고침했습니다"); };

    var body = p.querySelector("#upBody");
    body.innerHTML =
      '<p class="hint" style="margin:0 0 14px">각 사이트의 <b>' + month.slice(0, 4) + '년 ' + (+month.slice(5, 7)) + '월 예약 페이지</b>를 열어(아래 “페이지 열기”) 화면 내용을 <b>전체 선택·복사</b>해 붙여넣고 “AI 분석”을 누르면 날짜별 여유/여석/마감을 채웁니다.</p>' +
      '<div id="parseList"></div>';
    var list = body.querySelector("#parseList");

    getSample().then(function (sample) {
      state.sites.forEach(function (s, idx) {
        var d = document.createElement("details");
        d.className = "parse-site";
        if (idx === 0) d.open = true;
        d.innerHTML =
          '<summary><span class="caret">▸</span>' + esc(s.name) + '</summary>' +
          '<div class="inner">' +
            '<div class="row">' +
              '<button data-openpage>' + esc(s.name) + ' 페이지 열기 ↗</button>' +
              '<span class="hint">' + esc(shortUrl(s.url)) + '</span>' +
            '</div>' +
            '<label class="fld" style="margin-top:10px"><span class="lbl">예약 페이지 내용 붙여넣기</span>' +
            '<textarea data-src placeholder="예약 페이지에서 복사한 텍스트..."></textarea></label>' +
            '<div class="row">' +
              (sample ? '<button class="btn-primary" data-analyze>AI 분석</button>' : '') +
              '<button data-clearmonth>이 사이트 이 달 표시 지우기</button>' +
              '<span class="status-msg" data-msg>' + (sample ? '' : 'AI 분석은 이 화면에서 사용할 수 없습니다. 상태칩을 직접 눌러 표시하세요.') + '</span>' +
            '</div>' +
          '</div>';
        list.appendChild(d);

        d.querySelector("[data-openpage]").onclick = function () {
          window.open(buildUrl(s.url, month + "-01"), "_blank", "noopener");
        };
        d.querySelector("[data-clearmonth]").onclick = function () {
          clearMonth(s.id, month); d.querySelector("[data-msg]").textContent = "이 달 표시를 지웠습니다."; d.querySelector("[data-msg]").className = "status-msg ok";
        };
        var an = d.querySelector("[data-analyze]");
        if (an) an.onclick = function () { analyze(s, month, d, sample, an); };
      });
    });
  }

  function shortUrl(u) { return u.replace(/^https?:\/\//, "").split(/[?#]/)[0]; }

  function clearMonth(siteId, month) {
    var s = state.status[siteId];
    if (!s) return;
    Object.keys(s).forEach(function (iso) { if (iso.slice(0, 7) === month) delete s[iso]; });
    save();
  }

  function analyze(site, month, node, sample, btn) {
    var msg = node.querySelector("[data-msg]");
    var src = node.querySelector("[data-src]").value.trim();
    if (src.length < 20) { msg.className = "status-msg err"; msg.textContent = "붙여넣은 내용이 너무 짧습니다."; return; }
    if (src.length > 48000) src = src.slice(0, 48000);
    btn.disabled = true;
    msg.className = "status-msg";
    msg.textContent = "분석 중… (수십 초 걸릴 수 있어요)";

    var n = daysInMonth(month);
    var prompt =
      "다음은 한국 낚시배 예약 사이트에서 복사한 " + month.slice(0, 4) + "년 " + (+month.slice(5, 7)) + "월 예약 현황 페이지 내용이다.\n" +
      "각 날짜(1~" + n + "일)의 예약 가능 여부를 판정하라.\n" +
      "- 자리가 남아 있으면 \"open\"\n- 마감/만석/예약불가/출항취소면 \"full\"\n- 잔여석이 적거나(예: 남은자리 1~3명) 대기면 \"few\"\n- 정보가 없으면 그 날짜는 결과에서 생략\n" +
      "남은자리 수나 짧은 메모가 있으면 note에 8자 이내로 넣어라(예: \"3자리\", \"오전만\").\n" +
      "오직 JSON 하나만 출력. 형식: {\"" + month + "-01\":{\"s\":\"open\",\"n\":\"4자리\"}, \"" + month + "-15\":{\"s\":\"full\"}}\n" +
      "s 값은 open/few/full 중 하나. 날짜 키는 YYYY-MM-DD.\n\n--- 페이지 내용 ---\n" + src;

    sample.json(prompt, { modelTier: "default" }).then(function (res) {
      var applied = 0;
      if (res && typeof res === "object") {
        if (!state.status[site.id]) state.status[site.id] = {};
        Object.keys(res).forEach(function (iso) {
          if (iso.slice(0, 7) !== month) return;
          var v = res[iso]; if (!v) return;
          var s = String(v.s || "").toLowerCase();
          if (["open", "few", "full"].indexOf(s) < 0) return;
          state.status[site.id][iso] = { s: s, n: v.n ? String(v.n).slice(0, 10) : "" };
          applied++;
        });
        save();
      }
      msg.className = "status-msg ok";
      msg.textContent = applied ? (applied + "일 채웠습니다. 달력에 반영됨.") : "인식된 날짜가 없습니다. 내용을 더 포함해 다시 시도하세요.";
      render();
    }).catch(function (e) {
      msg.className = "status-msg err";
      var code = e && e.code;
      if (code === "not_granted" || code === "sampling_disabled") msg.textContent = "이 브라우저/계정에서 AI 분석이 허용되지 않았습니다.";
      else if (code === "rate_limited") msg.textContent = "요청이 많습니다. 잠시 후 다시 시도하세요.";
      else if (code === "invalid_json") msg.textContent = "결과를 해석하지 못했습니다. 다시 시도하거나 내용을 줄여 보세요.";
      else msg.textContent = "분석 실패: " + (e && e.message ? e.message : code || "알 수 없는 오류");
    }).then(function () { btn.disabled = false; });
  }

  // ---------- go ----------
  render();
  // 자동 예약현황(avail.js)이 나중에 로드되면 다시 그림
  window.__renderAvail = function () { render(); };
  if (window.AVAIL) render();
})();
</script>
